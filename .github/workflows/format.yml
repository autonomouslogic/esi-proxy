name: Format
on: [ push ]
jobs:
  Format:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
          cache: gradle

      - name: Lint
        run: |
          echo "Run 'make format' to auto-format"
          make lint
